name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # All pinned actions below are Node24-native majors, and runners default to
  # Node24 since 2026-06-16. This flag is now redundant belt-and-suspenders:
  # it forces any remaining Node20-declaring action onto Node24. Harmless to keep.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    name: Verification suite (20 gates + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      # MiniLM (~25 MB) used by verify:semantic + verify:embedder; cached.
      # Keyed on the pin-bearing integrity module: any revision/hash change
      # busts the cache, and there is NO broad restore-keys fallback (a stale
      # cache may only be rejected/replaced through the pinned-download path).
      - name: Cache embedding model
        uses: actions/cache@v5
        with:
          path: node_modules/@xenova/transformers/.cache
          key: minilm-${{ hashFiles('scripts/embedder-integrity.mjs') }}
      # Materialize the gitignored ONNX into assets/minilm (cache-first,
      # Hugging Face download on a cold cache, always byte-verified).
      - name: Fetch embedder assets
        run: npm run fetch:embedder
      - name: verify:all (20 gates + typecheck)
        run: npm run verify:all
      - name: Seeder physiology — pinned alignment + today's alignment
        run: |
          node scripts/seed-db.ts --end=2026-06-10 --db=/tmp/pinned.db
          node scripts/seed-db.ts --db=/tmp/today.db
      - name: Metro production bundle
        working-directory: apps/mobile
        run: |
          mkdir -p build
          npx react-native bundle --platform android --dev false \
            --entry-file index.js \
            --bundle-output build/index.android.bundle \
            --assets-dest build/assets

  android-apk:
    name: Android debug APK (sideloadable, never for Play)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      # The triage embedding model ships inside the APK (Android assets);
      # cache-first fetch, then stage it where AGP packages assets from.
      # Cache key is bound to the pin-bearing integrity module; no broad
      # restore-keys fallback (stale caches fail closed at fetch).
      - name: Cache embedding model
        uses: actions/cache@v5
        with:
          path: node_modules/@xenova/transformers/.cache
          key: minilm-${{ hashFiles('scripts/embedder-integrity.mjs') }}
      - name: Stage embedder model into Android assets
        run: |
          npm run fetch:embedder
          mkdir -p apps/mobile/android/app/src/main/assets
          cp packages/inference/assets/minilm/model_quantized.onnx \
             apps/mobile/android/app/src/main/assets/minilm.onnx
      # This artifact is deliberately DEBUG-signed for local device QA. Play
      # release artifacts require the external upload key documented in
      # docs/PRE_RELEASE_ANDROID.md and are never signed with this key.
      - name: Build debug QA APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: athlete-kinetics-debug-qa-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
