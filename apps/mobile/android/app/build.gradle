apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders — monorepo: app root is apps/mobile, node_modules is hoisted to
       the workspace root (four levels up from android/app). */
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    // hermesc lookup does NOT follow reactNativeDir (it probes the app-root
    // node_modules, empty under workspace hoisting) — point it explicitly.
    hermesCommand = "$rootDir/../../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Production signing material must live outside the repository. Gradle accepts
// either -P properties or same-named environment variables so local builds and
// CI can use their own secret stores without a checked-in properties file.
def releaseStoreFile = project.findProperty('AK_UPLOAD_STORE_FILE') ?: System.getenv('AK_UPLOAD_STORE_FILE')
def releaseStorePassword = project.findProperty('AK_UPLOAD_STORE_PASSWORD') ?: System.getenv('AK_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('AK_UPLOAD_KEY_ALIAS') ?: System.getenv('AK_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('AK_UPLOAD_KEY_PASSWORD') ?: System.getenv('AK_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.toString().trim().isEmpty() }

gradle.taskGraph.whenReady { taskGraph ->
    def requestedReleaseArtifact = taskGraph.allTasks.any { candidate ->
        def task = candidate.name.toLowerCase()
        candidate.project == project && task.contains('release')
            && (task.contains('assemble') || task.contains('bundle')
                || task.contains('install') || task.contains('publish')
                || task.contains('package'))
    }
    if (requestedReleaseArtifact && !hasReleaseSigning) {
        throw new GradleException(
            'Release signing is not configured. Set AK_UPLOAD_STORE_FILE, '
            + 'AK_UPLOAD_STORE_PASSWORD, AK_UPLOAD_KEY_ALIAS, and AK_UPLOAD_KEY_PASSWORD.'
        )
    }
}

def appVersionCode = project.findProperty('AK_VERSION_CODE') ?: System.getenv('AK_VERSION_CODE') ?: '1'
def appVersionName = project.findProperty('AK_VERSION_NAME') ?: System.getenv('AK_VERSION_NAME') ?: '1.0.0-beta.1'

// Beta build switch (issue #132). AK_BETA_BUILD=on turns on the beta features
// (the question box). It is read by babel.config.js when the JS bundle is built,
// so it must be an ENVIRONMENT variable of this Gradle run; a -P property never
// reaches the bundler and would silently give a non-beta build, so refuse it.
// Unset means not a beta build.
if (project.hasProperty('AK_BETA_BUILD')) {
    throw new GradleException(
        'AK_BETA_BUILD must be set as an environment variable, not a -P property: '
        + 'it is read by the JS bundler. PowerShell: $env:AK_BETA_BUILD=\'on\''
    )
}
// Declare it as an input of the JS bundle tasks, so changing it re-bundles
// instead of reusing an up-to-date bundle built with the other value.
def betaBuildEnv = System.getenv('AK_BETA_BUILD') ?: ''
tasks.matching { it.name.startsWith('createBundle') && it.name.endsWith('JsAndAssets') }.configureEach {
    inputs.property('AK_BETA_BUILD', betaBuildEnv)
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    externalNativeBuild {
        cmake {
            // CMake 3.22.1 hits a Windows ninja regeneration loop
            // ("manifest 'build.ninja' still dirty after 100 tries").
            // 3.30.x also ships a newer ninja. Installed via sdkmanager.
            version rootProject.ext.cmakeVersion
        }
    }

    namespace "com.athletekinetics"
    defaultConfig {
        // Permanent Play identity (R8 §2.6): com.pikemethods.training is the
        // production id; the qa variant appends .qa below. Package names become
        // permanent after the first Play upload — never change casually.
        applicationId "com.pikemethods.training"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(appVersionCode.toString())
        // First closed-beta version (R8 §2.6): 1 / 1.0.0-beta.1 unless pinned
        // explicitly through AK_VERSION_CODE / AK_VERSION_NAME.
        versionName appVersionName.toString()
        // NOTE: this app module has no own CMake build (no src/main/cpp), so
        // these arguments affect nothing in this module. The 16 KB alignment
        // of autolinked native modules is governed by the NDK version pinned
        // in the root build.gradle — NDK r28+ aligns ELF LOAD segments to
        // 16 KB by default. Keep the NDK at r28 or newer; do not rely on
        // app-level flags to reach op-sqlite / onnxruntime-react-native.
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // QA acceptance variant (WO remediation B1): production source/runtime,
        // NON-debuggable (so the React Native plugin bundles the JS/Hermes
        // application), debug-key signed, .qa application-id suffix so it
        // coexists with developer installs. Never a Play artifact; never
        // described as a Metro-dependent dev shell. Runtime needs no dev
        // server, Metro, adb reverse, or host connection.
        qa {
            initWith buildTypes.release
            applicationIdSuffix ".qa"
            versionNameSuffix "-QA"
            debuggable false
            jniDebuggable false
            // Explicitly non-shrinking so the QA binary matches the release
            // runtime configuration (enableProguardInReleaseBuilds is false).
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Debug-key signed, clearly labeled non-production (see B1 comment).
            signingConfig signingConfigs.debug
            // Dependency-resolution fallback so libraries that only publish a
            // release variant resolve for this non-debuggable build type.
            matchingFallbacks += "release"
            // The RN gradle plugin injects the usesCleartextTraffic placeholder
            // for its debug/release types only; the QA variant must supply it
            // itself (offline QA artifact: cleartext stays disabled).
            manifestPlaceholders["usesCleartextTraffic"] = "false"
            // Clearly labeled non-production on the launcher.
            resValue "string", "app_name", "pikeMethods QA"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// --- R8 §2.5: reproducible Archivo packaging ----------------------------------
// The variable-font source is pinned by hash; exactly one file is copied into
// src/main/assets/fonts. No npx/react-native-asset dependency, no generated
// Android res — the raw TTF ships as an app asset that RN resolves through the
// theme's fontFamily: 'Archivo'. The copy FAILS CLOSED when the source bytes do
// not match the ratified SHA-256. Self-contained on purpose: it must not depend
// on helpers declared later in this script.
def archivoSource = new File(projectDir, '../../assets/fonts/Archivo/Archivo-VariableFont_wdth,wght.ttf').canonicalFile
def ARCHIVO_SHA256 = 'bc878c6e9e36b848bfa2fb9174acdf812ea6df640fd167f2c95b42674729f6b5'
def archivoTarget = file("src/main/assets/fonts/Archivo.ttf")
def archivoSha256 = { File f ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { ins ->
        def buf = new byte[8192]
        int read
        while ((read = ins.read(buf)) > 0) { digest.update(buf, 0, read) }
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

tasks.register("packageArchivoFont") {
    group = "verification"
    description = "Copies the hash-pinned Archivo variable font into main assets."
    outputs.file(archivoTarget)
    outputs.upToDateWhen { false }
    doLast {
        if (!archivoSource.isFile()) {
            throw new GradleException("Archivo packaging: tracked source missing: ${archivoSource}")
        }
        def actual = archivoSha256(archivoSource)
        if (actual != ARCHIVO_SHA256) {
            throw new GradleException(
                "Archivo packaging: source sha256 ${actual} != ratified pin ${ARCHIVO_SHA256}; refusing to package")
        }
        archivoTarget.parentFile.mkdirs()
        java.nio.file.Files.copy(archivoSource.toPath(), archivoTarget.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("[archivo] packaged ${archivoTarget.name} (${archivoSha256(archivoTarget)})")
    }
}

tasks.configureEach { task ->
    def n = task.name
    if (n == 'mergeReleaseAssets' || n == 'mergeQaAssets' || n == 'mergeDebugAssets') {
        task.dependsOn packageArchivoFont
    }
    // Lint tasks (lintVital report models / analyze) also read src/main/assets
    // as an input directory; without this edge Gradle's implicit-dependency
    // validation fails the build (observed on :app:generateQaLintVitalReportModel).
    if (n.contains('Lint') || n.contains('lint')) {
        task.dependsOn packageArchivoFont
    }
}

// --- QA candidate identity manifest (WO remediation B2) ----------------------
// Generated at build time into build/generated (never a maintained source
// asset) and packaged ONLY into the qa variant. Carries enough correlation to
// audit the dirty candidate WITHOUT absolute local paths, usernames, .git
// data, credentials, or report text. Fails closed when any required identity
// input is absent, malformed, or inconsistent.
def repoRoot = rootDir.getParentFile().getParentFile().getParentFile() // android -> mobile -> apps -> repo

def gitCapture = { List<String> args ->
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def proc = new ProcessBuilder(["git"] + args)
        .directory(repoRoot)
        .redirectErrorStream(false)
        .start()
    proc.inputStream.withCloseable { stdout << it }
    proc.errorStream.withCloseable { stderr << it }
    if (proc.waitFor() != 0) {
        throw new GradleException(
            "git ${args.join(' ')} failed (${proc.exitValue()}): ${stderr.toString().trim()}") as Object
    }
    return stdout.toByteArray()
}

def gitText = { List<String> args -> new String(gitCapture(args), 'UTF-8').trim() }

def sha256Hex = { byte[] bytes ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    return digest.digest(bytes).collect { String.format('%02x', it) }.join()
}

def sha256OfFile = { File f -> sha256Hex(f.bytes) }

/** Tracked-diff fingerprint method: SHA-256 over the exact bytes of
 *  `git diff --full-index --binary HEAD` (byte-preserving, no newline or
 *  encoding translation anywhere in the pipeline). */
def EMPTY_DIFF_SHA256 = sha256Hex(new byte[0])

def requirePin = { String label, String value, java.util.regex.Pattern pattern ->
    if (value == null || !(value ==~ pattern)) {
        throw new GradleException("QA candidate manifest: malformed ${label}: '${value}'")
    }
    return value
}

// --- Model supply-chain pins (shared) ----------------------------------------
// Single parse of both on-device model pins, from the sources of truth
// scripts/embedder-integrity.mjs and scripts/safety-reader-integrity.mjs.
// Consumed by generateQaCandidateManifest and by the producer-task archive
// verifier (packageQa / packageRelease / signReleaseBundle). Fails closed with
// GradleException when any pin is missing or malformed.
// scripts/embedder-integrity.mjs declares no byte-size pin for
// onnx/model_quantized.onnx, so the ratified MiniLM size (formerly the literal
// candidate-manifest model.sizeBytes value) is defined exactly once, here.
def MINILM_PINNED_SIZE_BYTES = 22972370L
def MINILM_REVISION_PIN_RE = ~/PINNED_REVISION\s*=\s*'([0-9a-f]{40})'/
def MINILM_SHA_PIN_RE = ~/'onnx\/model_quantized\.onnx':\s*\n\s*'([0-9a-f]{64})'/
def READER_ID_PIN_RE = ~/SAFETY_READER_MODEL_ID\s*=\s*'([^']+)'/
def READER_POLICY_PIN_RE = ~/SAFETY_READER_POLICY_ID\s*=\s*'([^']+)'/
def READER_TAG_PIN_RE = ~/PINNED_RELEASE_TAG\s*=\s*'([^']+)'/
def READER_COMMIT_PIN_RE = ~/PINNED_RELEASE_COMMIT\s*=\s*'([0-9a-f]{40})'/
def READER_ASSET_ID_PIN_RE = ~/PINNED_ASSET_ID\s*=\s*(\d+)/
def READER_ARTIFACT_PIN_RE = ~/SAFETY_READER_ARTIFACT\s*=\s*'reader_quantized\.onnx'/
// KNOWN_BYTES / KNOWN_SHA256 use the computed key [SAFETY_READER_ARTIFACT].
def READER_BYTES_PIN_RE = ~/\[SAFETY_READER_ARTIFACT\]:\s*(\d+)/
def READER_SHA_PIN_RE = ~/\[SAFETY_READER_ARTIFACT\]:\s*\n\s*'([0-9a-f]{64})'/

def loadModelPins = { ->
    def readPinSource = { String rel ->
        def f = new File(repoRoot, rel)
        if (!f.isFile()) {
            throw new GradleException("Model pins: ${rel} missing")
        }
        return f.getText('UTF-8')
    }
    def capturePin = { String src, java.util.regex.Pattern re, String label, String rel ->
        def m = re.matcher(src)
        if (!m.find()) {
            throw new GradleException("Model pins: cannot parse ${label} from ${rel}")
        }
        return m.group(1)
    }
    def parsePositiveLong = { String value, String label ->
        long parsed
        try {
            parsed = Long.parseLong(value)
        } catch (NumberFormatException ignored) {
            throw new GradleException("Model pins: malformed ${label}: '${value}'")
        }
        if (parsed <= 0L) {
            throw new GradleException("Model pins: ${label} must be a positive integer: '${value}'")
        }
        return parsed
    }

    def embedderRel = 'scripts/embedder-integrity.mjs'
    def embedderSrc = readPinSource(embedderRel)
    def readerRel = 'scripts/safety-reader-integrity.mjs'
    def readerSrc = readPinSource(readerRel)
    if (!READER_ARTIFACT_PIN_RE.matcher(readerSrc).find()) {
        throw new GradleException("Model pins: SAFETY_READER_ARTIFACT is not 'reader_quantized.onnx' in ${readerRel}")
    }
    if (!(MINILM_PINNED_SIZE_BYTES instanceof Long) || MINILM_PINNED_SIZE_BYTES <= 0L) {
        throw new GradleException("Model pins: MINILM_PINNED_SIZE_BYTES must be a positive integer")
    }
    return [
        minilmRevision     : capturePin(embedderSrc, MINILM_REVISION_PIN_RE, 'PINNED_REVISION', embedderRel),
        minilmSha256       : capturePin(embedderSrc, MINILM_SHA_PIN_RE, "'onnx/model_quantized.onnx' SHA-256", embedderRel),
        minilmBytes        : MINILM_PINNED_SIZE_BYTES,
        readerModelId      : capturePin(readerSrc, READER_ID_PIN_RE, 'SAFETY_READER_MODEL_ID', readerRel),
        readerPolicyId     : capturePin(readerSrc, READER_POLICY_PIN_RE, 'SAFETY_READER_POLICY_ID', readerRel),
        readerReleaseTag   : capturePin(readerSrc, READER_TAG_PIN_RE, 'PINNED_RELEASE_TAG', readerRel),
        readerReleaseCommit: capturePin(readerSrc, READER_COMMIT_PIN_RE, 'PINNED_RELEASE_COMMIT', readerRel),
        readerAssetId      : parsePositiveLong(
            capturePin(readerSrc, READER_ASSET_ID_PIN_RE, 'PINNED_ASSET_ID', readerRel), 'PINNED_ASSET_ID'),
        readerBytes        : parsePositiveLong(
            capturePin(readerSrc, READER_BYTES_PIN_RE, 'KNOWN_BYTES[SAFETY_READER_ARTIFACT]', readerRel),
            'KNOWN_BYTES[SAFETY_READER_ARTIFACT]'),
        readerSha256       : capturePin(readerSrc, READER_SHA_PIN_RE, 'KNOWN_SHA256[SAFETY_READER_ARTIFACT]', readerRel),
    ]
}

def qaCandidateManifestTask = tasks.register("generateQaCandidateManifest") {
    group = "verification"
    description = "Generates the non-secret QA candidate identity manifest."
    def outDir = layout.buildDirectory.dir("generated/candidate_manifest")
    outputs.dir(outDir)
    outputs.upToDateWhen { false }
    doLast {
        def branch = requirePin('branch name', gitText(['rev-parse', '--abbrev-ref', 'HEAD']), ~/[^\x00]+/)
        def head = requirePin('HEAD commit', gitText(['rev-parse', 'HEAD']), ~/[0-9a-f]{40}/)
        def diffBytes = gitCapture(['diff', '--full-index', '--binary', 'HEAD'])
        def diffSha = sha256Hex(diffBytes)
        boolean dirty = diffSha != EMPTY_DIFF_SHA256

        // Intended staged/new-file material (WO staging permission): untracked
        // files except the two pre-existing owner/process artifacts, which are
        // explicitly NOT candidate inputs. Also includes files STAGED as new
        // (index-added, absent from HEAD) — once staged they leave ls-files
        // --others, but they remain new candidate material and must be pinned.
        def OWNER_ARTIFACTS = ['TASK.md', 'audit_task_b.mjs'] as Set
        def newFiles = []
        def addedPaths = gitText(['diff', '--cached', '--name-only', '--diff-filter=A'])
            .split('\n').findAll { it.trim() }
            .findAll { !OWNER_ARTIFACTS.contains(it.trim()) }
        addedPaths.each { rel ->
            def f = new File(repoRoot, rel.trim())
            if (!f.isFile()) {
                throw new GradleException("QA candidate manifest: staged-new path is not a regular file: ${rel}")
            }
            newFiles.add([path: rel.trim().replace('\\', '/'), sha256: sha256OfFile(f)])
        }
        gitText(['ls-files', '--others', '--exclude-standard']).split('\n')
            .findAll { it.trim() }
            .findAll { !OWNER_ARTIFACTS.contains(it.trim()) }
            .findAll { !addedPaths.contains(it.trim()) }
            .sort()
            .each { rel ->
                def f = new File(repoRoot, rel.trim())
                if (!f.isFile()) {
                    throw new GradleException("QA candidate manifest: untracked path is not a regular file: ${rel}")
                }
                newFiles.add([path: rel.trim().replace('\\', '/'), sha256: sha256OfFile(f)])
            }

        // Embedder + safety-reader supply-chain pins — parsed once by the
        // shared loadModelPins helper from scripts/embedder-integrity.mjs and
        // scripts/safety-reader-integrity.mjs; never duplicated here.
        def pins = loadModelPins()
        def modelRevision = pins.minilmRevision
        def modelSha = pins.minilmSha256

        def stagedModel = new File(repoRoot, 'packages/inference/assets/minilm/model_quantized.onnx')
        if (!stagedModel.isFile()) {
            throw new GradleException(
                "QA candidate manifest: ${stagedModel} missing - run 'npm run fetch:embedder' before building the QA artifact")
        }
        def stagedModelSha = sha256OfFile(stagedModel)
        if (stagedModelSha != modelSha) {
            throw new GradleException(
                "QA candidate manifest: staged model sha256 ${stagedModelSha} != ratified pin ${modelSha}; refusing to build")
        }

        def readerModelId = pins.readerModelId
        def readerPolicyId = pins.readerPolicyId
        def readerReleaseTag = pins.readerReleaseTag
        def readerReleaseCommit = pins.readerReleaseCommit
        def readerAssetId = pins.readerAssetId
        def readerBytes = pins.readerBytes
        def readerSha = pins.readerSha256

        def materializedReader = new File(repoRoot, 'packages/inference/assets/safety-reader/reader_quantized.onnx')
        if (!materializedReader.isFile()) {
            throw new GradleException(
                "QA candidate manifest: ${materializedReader} missing - run 'npm run fetch:safety-reader' before building the QA artifact")
        }
        if (materializedReader.length() != readerBytes || sha256OfFile(materializedReader) != readerSha) {
            throw new GradleException(
                "QA candidate manifest: materialized safety reader failed size/sha256 check against ${readerSha}; refusing to build")
        }
        def stagedAndroidReader = file('src/main/assets/safety_reader.onnx')
        if (!stagedAndroidReader.isFile()) {
            throw new GradleException(
                "QA candidate manifest: ${stagedAndroidReader} missing - stage via 'node scripts/stage-native-safety-reader.mjs apps/mobile/android/app/src/main/assets/safety_reader.onnx --required'")
        }
        if (stagedAndroidReader.length() != readerBytes || sha256OfFile(stagedAndroidReader) != readerSha) {
            throw new GradleException(
                "QA candidate manifest: staged Android safety_reader.onnx failed size/sha256 check against ${readerSha}; refusing to build")
        }

        def rnPkg = new groovy.json.JsonSlurper()
            .parse(new File(repoRoot, 'node_modules/react-native/package.json'))
        def ortRnPkg = new groovy.json.JsonSlurper()
            .parse(new File(repoRoot, 'node_modules/onnxruntime-react-native/package.json'))

        def manifest = [
            schema              : 'ak.candidate-manifest/1',
            label               : 'NON_PRODUCTION_QA_DEBUG_SIGNED',
            branch              : branch,
            head                : head,
            sourceDirty         : dirty,
            trackedDiffFingerprint: [
                method: "sha256(git diff --full-index --binary HEAD)",
                value : diffSha,
            ],
            newFiles            : newFiles,
            qaLifecycleTelemetry: true,
            model               : [
                id           : 'Xenova/all-MiniLM-L6-v2',
                revision     : modelRevision,
                assetPath    : 'assets/minilm.onnx',
                sha256       : modelSha,
                sizeBytes    : pins.minilmBytes,
            ],
            safetyReader        : [
                id           : readerModelId,
                policyId     : readerPolicyId,
                releaseTag   : readerReleaseTag,
                releaseCommit: readerReleaseCommit,
                assetId      : readerAssetId,
                assetPath    : 'assets/safety_reader.onnx',
                sha256       : readerSha,
                sizeBytes    : readerBytes,
            ],
            packageId           : 'com.pikemethods.training.qa',
            versionCode         : android.defaultConfig.versionCode,
            versionName         : "${android.defaultConfig.versionName}-QA",
            buildVariant        : 'qa',
            reactNativeVersion  : rnPkg.version,
            onnxRuntimeReactNativeVersion: ortRnPkg.version,
            onnxRuntimeAndroidVersion: rootProject.ext.onnxruntimeAndroidVersion,
            builtAtUtc          : java.time.Instant.now().toString(),
        ]

        def dir = outDir.get().asFile
        dir.mkdirs()
        def out = new File(dir, 'candidate_manifest.json')
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + "\n"
        logger.lifecycle("[qa-manifest] wrote ${out} (head=${head.take(12)} dirty=${dirty})")
    }
}

android {
    sourceSets {
        qa {
            // Packaged from build/generated only; source dirs stay clean.
            assets.srcDir layout.buildDirectory.dir("generated/candidate_manifest")
        }
    }
}

// Every qa-variant task that reads sources/assets/lint inputs must run after
// the manifest exists (Gradle implicit-dependency validation fails otherwise,
// since lint scans build/generated).
tasks.configureEach { task ->
    def n = task.name
    if (n == 'mergeQaAssets'
            || (n.contains('Qa') && (n.contains('Lint') || n.contains('lint')))) {
        task.dependsOn qaCandidateManifestTask
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // onnxruntime-react-native extracts this AAR to link its JSI shim, but does
    // not add the AAR to the app runtime classpath. Declare it here so the APK
    // contains libonnxruntime.so alongside libonnxruntimejsi.so.
    implementation("com.microsoft.onnxruntime:onnxruntime-android:${rootProject.ext.onnxruntimeAndroidVersion}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// modelAssets: list of [entry: <zip entry name>, bytes: <long>, sha256: <hex>]
// that must each be packaged at exactly that size and SHA-256. Empty for debug
// producers (ONNX .so pairing only). Expected pins are parameters so the
// packaging contract can exercise the check with small synthetic fixtures.
def verifyOnnxRuntimeArchive = { File artifact, String libraryRoot, List modelAssets = [] ->
    if (!artifact.isFile()) {
        throw new GradleException("Expected Android artifact was not produced: ${artifact}")
    }

    def failure = null
    def archive = null
    try {
        archive = new java.util.zip.ZipFile(artifact)
        def jsiEntries = []
        def entries = archive.entries()
        while (entries.hasMoreElements()) {
            def entryName = entries.nextElement().name
            if (entryName.startsWith(libraryRoot)
                && entryName.endsWith("/libonnxruntimejsi.so")) {
                jsiEntries.add(entryName)
            }
        }
        if (jsiEntries.isEmpty()) {
            failure = "contains no libonnxruntimejsi.so"
        } else {
            def missingBaseEntries = jsiEntries.collect { entry ->
                entry.replace("libonnxruntimejsi.so", "libonnxruntime.so")
            }.findAll { entry -> archive.getEntry(entry) == null }
            if (!missingBaseEntries.isEmpty()) {
                failure = "is missing ONNX Runtime native libraries: ${missingBaseEntries.join(', ')}"
            }
        }
        if (failure == null) {
            for (def asset : modelAssets) {
                def modelEntry = archive.getEntry(asset.entry as String)
                if (modelEntry == null || modelEntry.isDirectory()) {
                    failure = "is missing pinned model asset ${asset.entry}"
                    break
                }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                long count = 0L
                archive.getInputStream(modelEntry).withCloseable { input ->
                    byte[] buffer = new byte[65536]
                    int read
                    while ((read = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, read)
                        count += read
                    }
                }
                if (count != (asset.bytes as long)) {
                    failure = "model asset ${asset.entry} size mismatch: ${count} B, pinned ${asset.bytes} B"
                    break
                }
                def actualSha = digest.digest().collect { String.format('%02x', it) }.join()
                if (actualSha != (asset.sha256 as String)) {
                    failure = "model asset ${asset.entry} SHA-256 mismatch: ${actualSha}, pinned ${asset.sha256}"
                    break
                }
            }
        }
    } catch (Exception error) {
        failure = "could not be inspected as a ZIP archive (${error.class.simpleName})"
    } finally {
        if (archive != null) archive.close()
    }

    if (failure != null) {
        // Never leave a failed, apparently uploadable/installable artifact in
        // the output directory after the build has been rejected.
        if (artifact.exists() && !artifact.delete()) {
            throw new GradleException(
                "Android artifact ${failure}; also failed to delete rejected artifact: ${artifact}"
            )
        }
        throw new GradleException("Android artifact ${failure}: ${artifact}")
    }
    logger.lifecycle("[onnx-packaging] verified ${artifact.name}")
}

// Producer-task model pins: both on-device models under the given archive
// asset root ("assets/" for APKs, "base/assets/" for AABs), with exact size
// and SHA-256 sourced from loadModelPins. A null root (debug producers)
// requires no model assets.
def pinnedModelAssets = { String modelRoot ->
    if (modelRoot == null) {
        return []
    }
    def pins = loadModelPins()
    return [
        [entry: modelRoot + 'minilm.onnx', bytes: pins.minilmBytes, sha256: pins.minilmSha256],
        [entry: modelRoot + 'safety_reader.onnx', bytes: pins.readerBytes, sha256: pins.readerSha256],
    ]
}

// Each entry is either a name (written as one zero byte) or [name, byte[]].
def writeOnnxRuntimeFixture = { File artifact, List entries ->
    artifact.parentFile.mkdirs()
    def output = new java.util.zip.ZipOutputStream(new FileOutputStream(artifact))
    try {
        entries.each { spec ->
            def entryName = spec instanceof List ? spec[0] as String : spec as String
            output.putNextEntry(new java.util.zip.ZipEntry(entryName))
            if (spec instanceof List) {
                output.write(spec[1] as byte[])
            } else {
                output.write(0)
            }
            output.closeEntry()
        }
    } finally {
        output.close()
    }
}

def onnxPackagingContract = tasks.register("verifyOnnxRuntimePackagingContract") {
    group = "verification"
    description = "Exercises APK/AAB ONNX native-library pairing, pinned model-asset size/SHA-256, and rejection behavior."
    outputs.upToDateWhen { false }
    doLast {
        def fixtureDir = layout.buildDirectory.dir("tmp/onnx-packaging-contract").get().asFile
        def restrictedApk = new File(fixtureDir, "restricted.apk")
        writeOnnxRuntimeFixture(restrictedApk, [
            "lib/arm64-v8a/libonnxruntimejsi.so",
            "lib/arm64-v8a/libonnxruntime.so",
        ])
        verifyOnnxRuntimeArchive(restrictedApk, "lib/")

        def validBundle = new File(fixtureDir, "valid.aab")
        writeOnnxRuntimeFixture(validBundle, [
            "base/lib/arm64-v8a/libonnxruntimejsi.so",
            "base/lib/arm64-v8a/libonnxruntime.so",
            "base/lib/x86_64/libonnxruntimejsi.so",
            "base/lib/x86_64/libonnxruntime.so",
        ])
        verifyOnnxRuntimeArchive(validBundle, "base/lib/")

        [
            [new File(fixtureDir, "missing-apk-base.apk"), "lib/arm64-v8a/libonnxruntimejsi.so", "lib/"],
            [new File(fixtureDir, "missing-aab-base.aab"), "base/lib/arm64-v8a/libonnxruntimejsi.so", "base/lib/"],
            [new File(fixtureDir, "missing-jsi.apk"), "lib/arm64-v8a/libonnxruntime.so", "lib/"],
        ].each { fixture ->
            def rejectedArtifact = fixture[0] as File
            writeOnnxRuntimeFixture(rejectedArtifact, [fixture[1] as String])
            def rejected = false
            try {
                verifyOnnxRuntimeArchive(rejectedArtifact, fixture[2] as String)
            } catch (GradleException expected) {
                rejected = true
            }
            if (!rejected || rejectedArtifact.exists()) {
                throw new GradleException(
                    "ONNX packaging contract failed to reject and remove ${rejectedArtifact.name}"
                )
            }
        }

        def corruptArtifact = new File(fixtureDir, "corrupt.aab")
        corruptArtifact.withOutputStream { output -> output.write(0) }
        def corruptRejected = false
        try {
            verifyOnnxRuntimeArchive(corruptArtifact, "base/lib/")
        } catch (GradleException expected) {
            corruptRejected = true
        }
        if (!corruptRejected || corruptArtifact.exists()) {
            throw new GradleException("ONNX packaging contract failed to reject and remove corrupt.aab")
        }

        // Pinned model-asset enforcement. Small synthetic fixtures with
        // injected expected size/SHA-256 stand in for the real models.
        byte[] minilmFixture = "minilm-fixture".getBytes('UTF-8')
        byte[] readerFixture = "safety-reader-fixture".getBytes('UTF-8')
        def fixtureModelAssets = { String root ->
            [
                [entry: root + 'minilm.onnx', bytes: (long) minilmFixture.length, sha256: sha256Hex(minilmFixture)],
                [entry: root + 'safety_reader.onnx', bytes: (long) readerFixture.length, sha256: sha256Hex(readerFixture)],
            ]
        }
        byte[] minilmCorrupt = minilmFixture.clone()
        minilmCorrupt[0] = (byte) (minilmCorrupt[0] ^ 0xff)
        byte[] readerCorrupt = readerFixture.clone()
        readerCorrupt[readerCorrupt.length - 1] = (byte) (readerCorrupt[readerCorrupt.length - 1] ^ 0xff)
        byte[] readerTruncated = java.util.Arrays.copyOf(readerFixture, readerFixture.length - 1)
        def apkLibs = ["lib/arm64-v8a/libonnxruntimejsi.so", "lib/arm64-v8a/libonnxruntime.so"]
        def aabLibs = ["base/lib/arm64-v8a/libonnxruntimejsi.so", "base/lib/arm64-v8a/libonnxruntime.so"]

        def modelApk = new File(fixtureDir, "models.apk")
        writeOnnxRuntimeFixture(modelApk, apkLibs
            + [["assets/minilm.onnx", minilmFixture], ["assets/safety_reader.onnx", readerFixture]])
        verifyOnnxRuntimeArchive(modelApk, "lib/", fixtureModelAssets("assets/"))
        def modelBundle = new File(fixtureDir, "models.aab")
        writeOnnxRuntimeFixture(modelBundle, aabLibs
            + [["base/assets/minilm.onnx", minilmFixture], ["base/assets/safety_reader.onnx", readerFixture]])
        verifyOnnxRuntimeArchive(modelBundle, "base/lib/", fixtureModelAssets("base/assets/"))
        if (!modelApk.isFile() || !modelBundle.isFile()) {
            throw new GradleException("ONNX packaging contract removed a valid pinned-model fixture")
        }

        [
            [new File(fixtureDir, "missing-minilm.apk"), apkLibs
                + [["assets/safety_reader.onnx", readerFixture]],
                "lib/", "assets/", "missing pinned model asset assets/minilm.onnx"],
            [new File(fixtureDir, "missing-reader.aab"), aabLibs
                + [["base/assets/minilm.onnx", minilmFixture]],
                "base/lib/", "base/assets/", "missing pinned model asset base/assets/safety_reader.onnx"],
            [new File(fixtureDir, "misrooted-models.aab"), aabLibs
                + [["assets/minilm.onnx", minilmFixture], ["assets/safety_reader.onnx", readerFixture]],
                "base/lib/", "base/assets/", "missing pinned model asset base/assets/minilm.onnx"],
            [new File(fixtureDir, "corrupt-minilm.apk"), apkLibs
                + [["assets/minilm.onnx", minilmCorrupt], ["assets/safety_reader.onnx", readerFixture]],
                "lib/", "assets/", "model asset assets/minilm.onnx SHA-256 mismatch"],
            [new File(fixtureDir, "corrupt-reader.aab"), aabLibs
                + [["base/assets/minilm.onnx", minilmFixture], ["base/assets/safety_reader.onnx", readerCorrupt]],
                "base/lib/", "base/assets/", "model asset base/assets/safety_reader.onnx SHA-256 mismatch"],
            [new File(fixtureDir, "truncated-reader.apk"), apkLibs
                + [["assets/minilm.onnx", minilmFixture], ["assets/safety_reader.onnx", readerTruncated]],
                "lib/", "assets/", "model asset assets/safety_reader.onnx size mismatch"],
        ].each { fixture ->
            def rejectedArtifact = fixture[0] as File
            writeOnnxRuntimeFixture(rejectedArtifact, fixture[1] as List)
            def rejectionMessage = null
            try {
                verifyOnnxRuntimeArchive(rejectedArtifact, fixture[2] as String, fixtureModelAssets(fixture[3] as String))
            } catch (GradleException expected) {
                rejectionMessage = expected.message
            }
            if (rejectionMessage == null || !rejectionMessage.contains(fixture[4] as String)
                    || rejectedArtifact.exists()) {
                throw new GradleException(
                    "ONNX packaging contract failed to reject and remove ${rejectedArtifact.name} for '${fixture[4]}' (got: ${rejectionMessage})"
                )
            }
        }

        // Debug producers stay .so-pairing only; release/QA producers resolve
        // both pins from the integrity sources.
        if (!pinnedModelAssets(null).isEmpty()) {
            throw new GradleException("ONNX packaging contract: debug producers must not require model assets")
        }
        def releaseAssets = pinnedModelAssets("base/assets/")
        if (releaseAssets*.entry != ["base/assets/minilm.onnx", "base/assets/safety_reader.onnx"]) {
            throw new GradleException("ONNX packaging contract: unexpected pinned model entries ${releaseAssets*.entry}")
        }
    }
}

// Guard the artifact-producing task itself. APKs are written by package*;
// final signed AABs are written by sign*Bundle. This covers assemble, bundle,
// package, installDebug/run-android, and direct producer-task invocations.
// Force the small packaging step to execute so an old unverified artifact can
// never be reused solely because Gradle considered the task up to date.
// Third element: archive asset root whose minilm.onnx and safety_reader.onnx
// must match the pinned size and SHA-256 (signed release and QA producers);
// null keeps debug producers on .so pairing only.
def onnxArtifactTasks = [
    packageDebug: ["outputs/apk/debug/app-debug.apk", "lib/", null],
    packageQa: ["outputs/apk/qa/app-qa.apk", "lib/", "assets/"],
    packageRelease: ["outputs/apk/release/app-release.apk", "lib/", "assets/"],
    signDebugBundle: ["outputs/bundle/debug/app-debug.aab", "base/lib/", null],
    signReleaseBundle: ["outputs/bundle/release/app-release.aab", "base/lib/", "base/assets/"],
]

tasks.configureEach { task ->
    def artifactSpec = onnxArtifactTasks[task.name]
    if (artifactSpec != null) {
        task.dependsOn(onnxPackagingContract)
        task.outputs.upToDateWhen { false }
        task.doLast {
            def artifact = layout.buildDirectory.file(artifactSpec[0]).get().asFile
            verifyOnnxRuntimeArchive(artifact, artifactSpec[1], pinnedModelAssets(artifactSpec[2]))
        }
    }
}
