apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders — monorepo: app root is apps/mobile, node_modules is hoisted to
       the workspace root (four levels up from android/app). */
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    // hermesc lookup does NOT follow reactNativeDir (it probes the app-root
    // node_modules, empty under workspace hoisting) — point it explicitly.
    hermesCommand = "$rootDir/../../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Production signing material must live outside the repository. Gradle accepts
// either -P properties or same-named environment variables so local builds and
// CI can use their own secret stores without a checked-in properties file.
def releaseStoreFile = project.findProperty('AK_UPLOAD_STORE_FILE') ?: System.getenv('AK_UPLOAD_STORE_FILE')
def releaseStorePassword = project.findProperty('AK_UPLOAD_STORE_PASSWORD') ?: System.getenv('AK_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('AK_UPLOAD_KEY_ALIAS') ?: System.getenv('AK_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('AK_UPLOAD_KEY_PASSWORD') ?: System.getenv('AK_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.toString().trim().isEmpty() }

gradle.taskGraph.whenReady { taskGraph ->
    def requestedReleaseArtifact = taskGraph.allTasks.any { candidate ->
        def task = candidate.name.toLowerCase()
        candidate.project == project && task.contains('release')
            && (task.contains('assemble') || task.contains('bundle')
                || task.contains('install') || task.contains('publish')
                || task.contains('package'))
    }
    if (requestedReleaseArtifact && !hasReleaseSigning) {
        throw new GradleException(
            'Release signing is not configured. Set AK_UPLOAD_STORE_FILE, '
            + 'AK_UPLOAD_STORE_PASSWORD, AK_UPLOAD_KEY_ALIAS, and AK_UPLOAD_KEY_PASSWORD.'
        )
    }
}

def appVersionCode = project.findProperty('AK_VERSION_CODE') ?: System.getenv('AK_VERSION_CODE') ?: '1'
def appVersionName = project.findProperty('AK_VERSION_NAME') ?: System.getenv('AK_VERSION_NAME') ?: '1.0'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    externalNativeBuild {
        cmake {
            // CMake 3.22.1 hits a Windows ninja regeneration loop
            // ("manifest 'build.ninja' still dirty after 100 tries").
            // 3.30.x also ships a newer ninja. Installed via sdkmanager.
            version "3.30.5"
        }
    }

    namespace "com.athletekinetics"
    defaultConfig {
        applicationId "com.athletekinetics"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(appVersionCode.toString())
        versionName appVersionName.toString()
        // NOTE: this app module has no own CMake build (no src/main/cpp), so
        // these arguments affect nothing in this module. The 16 KB alignment
        // of autolinked native modules is governed by the NDK version pinned
        // in the root build.gradle — NDK r28+ aligns ELF LOAD segments to
        // 16 KB by default. Keep the NDK at r28 or newer; do not rely on
        // app-level flags to reach op-sqlite / onnxruntime-react-native.
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // onnxruntime-react-native extracts this AAR to link its JSI shim, but does
    // not add the AAR to the app runtime classpath. Declare it here so the APK
    // contains libonnxruntime.so alongside libonnxruntimejsi.so.
    implementation("com.microsoft.onnxruntime:onnxruntime-android:${rootProject.ext.onnxruntimeAndroidVersion}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

def verifyOnnxRuntimeArchive = { File artifact, String libraryRoot ->
    if (!artifact.isFile()) {
        throw new GradleException("Expected Android artifact was not produced: ${artifact}")
    }

    def failure = null
    def archive = null
    try {
        archive = new java.util.zip.ZipFile(artifact)
        def jsiEntries = []
        def entries = archive.entries()
        while (entries.hasMoreElements()) {
            def entryName = entries.nextElement().name
            if (entryName.startsWith(libraryRoot)
                && entryName.endsWith("/libonnxruntimejsi.so")) {
                jsiEntries.add(entryName)
            }
        }
        if (jsiEntries.isEmpty()) {
            failure = "contains no libonnxruntimejsi.so"
        } else {
            def missingBaseEntries = jsiEntries.collect { entry ->
                entry.replace("libonnxruntimejsi.so", "libonnxruntime.so")
            }.findAll { entry -> archive.getEntry(entry) == null }
            if (!missingBaseEntries.isEmpty()) {
                failure = "is missing ONNX Runtime native libraries: ${missingBaseEntries.join(', ')}"
            }
        }
    } catch (Exception error) {
        failure = "could not be inspected as a ZIP archive (${error.class.simpleName})"
    } finally {
        if (archive != null) archive.close()
    }

    if (failure != null) {
        // Never leave a failed, apparently uploadable/installable artifact in
        // the output directory after the build has been rejected.
        if (artifact.exists() && !artifact.delete()) {
            throw new GradleException(
                "Android artifact ${failure}; also failed to delete rejected artifact: ${artifact}"
            )
        }
        throw new GradleException("Android artifact ${failure}: ${artifact}")
    }
    logger.lifecycle("[onnx-packaging] verified ${artifact.name}")
}

def writeOnnxRuntimeFixture = { File artifact, List<String> entries ->
    artifact.parentFile.mkdirs()
    def output = new java.util.zip.ZipOutputStream(new FileOutputStream(artifact))
    try {
        entries.each { entryName ->
            output.putNextEntry(new java.util.zip.ZipEntry(entryName))
            output.write(0)
            output.closeEntry()
        }
    } finally {
        output.close()
    }
}

def onnxPackagingContract = tasks.register("verifyOnnxRuntimePackagingContract") {
    group = "verification"
    description = "Exercises APK/AAB ONNX native-library pairing and rejection behavior."
    outputs.upToDateWhen { false }
    doLast {
        def fixtureDir = layout.buildDirectory.dir("tmp/onnx-packaging-contract").get().asFile
        def restrictedApk = new File(fixtureDir, "restricted.apk")
        writeOnnxRuntimeFixture(restrictedApk, [
            "lib/arm64-v8a/libonnxruntimejsi.so",
            "lib/arm64-v8a/libonnxruntime.so",
        ])
        verifyOnnxRuntimeArchive(restrictedApk, "lib/")

        def validBundle = new File(fixtureDir, "valid.aab")
        writeOnnxRuntimeFixture(validBundle, [
            "base/lib/arm64-v8a/libonnxruntimejsi.so",
            "base/lib/arm64-v8a/libonnxruntime.so",
            "base/lib/x86_64/libonnxruntimejsi.so",
            "base/lib/x86_64/libonnxruntime.so",
        ])
        verifyOnnxRuntimeArchive(validBundle, "base/lib/")

        [
            [new File(fixtureDir, "missing-apk-base.apk"), "lib/arm64-v8a/libonnxruntimejsi.so", "lib/"],
            [new File(fixtureDir, "missing-aab-base.aab"), "base/lib/arm64-v8a/libonnxruntimejsi.so", "base/lib/"],
            [new File(fixtureDir, "missing-jsi.apk"), "lib/arm64-v8a/libonnxruntime.so", "lib/"],
        ].each { fixture ->
            def rejectedArtifact = fixture[0] as File
            writeOnnxRuntimeFixture(rejectedArtifact, [fixture[1] as String])
            def rejected = false
            try {
                verifyOnnxRuntimeArchive(rejectedArtifact, fixture[2] as String)
            } catch (GradleException expected) {
                rejected = true
            }
            if (!rejected || rejectedArtifact.exists()) {
                throw new GradleException(
                    "ONNX packaging contract failed to reject and remove ${rejectedArtifact.name}"
                )
            }
        }

        def corruptArtifact = new File(fixtureDir, "corrupt.aab")
        corruptArtifact.withOutputStream { output -> output.write(0) }
        def corruptRejected = false
        try {
            verifyOnnxRuntimeArchive(corruptArtifact, "base/lib/")
        } catch (GradleException expected) {
            corruptRejected = true
        }
        if (!corruptRejected || corruptArtifact.exists()) {
            throw new GradleException("ONNX packaging contract failed to reject and remove corrupt.aab")
        }
    }
}

// Guard the artifact-producing task itself. This covers assemble, bundle,
// package, installDebug/run-android, and direct package/bundle invocations.
// Force the small packaging step to execute so an old unverified artifact can
// never be reused solely because Gradle considered the task up to date.
def onnxArtifactTasks = [
    packageDebug: ["outputs/apk/debug/app-debug.apk", "lib/"],
    packageRelease: ["outputs/apk/release/app-release.apk", "lib/"],
    bundleDebug: ["outputs/bundle/debug/app-debug.aab", "base/lib/"],
    bundleRelease: ["outputs/bundle/release/app-release.aab", "base/lib/"],
]

tasks.configureEach { task ->
    def artifactSpec = onnxArtifactTasks[task.name]
    if (artifactSpec != null) {
        task.dependsOn(onnxPackagingContract)
        task.outputs.upToDateWhen { false }
        task.doLast {
            def artifact = layout.buildDirectory.file(artifactSpec[0]).get().asFile
            verifyOnnxRuntimeArchive(artifact, artifactSpec[1])
        }
    }
}
