buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26 // Health Connect client floor (was 24)
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "28.2.13676358" // r28: aligns native ELF LOAD segments to 16 KB by default (AUD-A16)
        cmakeVersion = "3.30.5" // avoids the CMake 3.22.1/Ninja regeneration loop on Windows
        kotlinVersion = "2.1.20"
        onnxruntimeAndroidVersion = "1.28.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// --- Native dependency pinning (AUD-A16) ------------------------------------
// The onnxruntime-react-native plugin declares FLOATING Maven coordinates
// (com.microsoft.onnxruntime:onnxruntime-android:latest.integration@aar,
// com.facebook.fbjni:fbjni:+). Floating versions break reproducible builds
// and can silently change native-binary alignment between builds. Force the
// resolved versions here at the root so every module builds against the
// pinned artifacts.
subprojects { subproject ->
    // Autolinked native-library modules do not inherit the app module's native
    // toolchain selection. Pin them here so every externalNativeBuild task uses
    // the supported CMake/NDK pair instead of platform defaults on Windows.
    subproject.plugins.withId("com.android.library") {
        subproject.extensions.configure("android") { androidExtension ->
            androidExtension.ndkVersion = rootProject.ext.ndkVersion
            androidExtension.externalNativeBuild {
                cmake {
                    version rootProject.ext.cmakeVersion
                }
            }
        }
    }

    subproject.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.microsoft.onnxruntime"
                && details.requested.name == "onnxruntime-android") {
                details.useVersion rootProject.ext.onnxruntimeAndroidVersion.toString()
            }
            if (details.requested.group == "com.facebook.fbjni"
                && details.requested.name == "fbjni") {
                details.useVersion "0.7.0"
            }
        }
    }
}
